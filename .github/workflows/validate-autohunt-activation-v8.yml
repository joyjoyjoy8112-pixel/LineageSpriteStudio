name: Validate AutoHunt Activation V8 PowerShell 5.1

on:
  push:
    branches:
      - native-autohunt-ui-v1
    paths:
      - 'ValidationV8/**'
      - '.github/workflows/validate-autohunt-activation-v8.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse with Windows PowerShell 5.1
        shell: cmd
        run: >
          powershell.exe -NoProfile -Command
          "$e=$null;$t=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'ValidationV8\ACTIVATE_AUTOHUNT_V8.ps1'),[ref]$t,[ref]$e)|Out-Null;if($e.Count){$e|%%{Write-Host ($_.Extent.StartLineNumber.ToString()+': '+$_.Message)};exit 1}else{Write-Host 'WINDOWS_POWERSHELL_5_1_PARSE_OK'}"

      - name: Run self-test with Windows PowerShell 5.1
        shell: cmd
        run: >
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File
          "ValidationV8\ACTIVATE_AUTOHUNT_V8.ps1" -SelfTest

      - name: Upload exact validated script
        uses: actions/upload-artifact@v4
        with:
          name: AUTOHUNT_ACTIVATION_V8_VALIDATED_SCRIPT
          path: ValidationV8/ACTIVATE_AUTOHUNT_V8.ps1
          if-no-files-found: error
