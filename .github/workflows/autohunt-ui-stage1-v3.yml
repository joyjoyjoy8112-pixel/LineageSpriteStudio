name: Package AutoHunt UI Stage1 V3

on:
  push:
    branches:
      - autohunt-diag20-labels
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package_stage1_v3 | Out-Null
          Copy-Item tools\autohunt_ui_stage1_v3\AUTOHUNT_UI_STAGE1_V3.ps1 package_stage1_v3\
          Copy-Item tools\autohunt_ui_stage1_v3\RUN_AUTOHUNT_UI_STAGE1_V3.bat package_stage1_v3\
          Copy-Item tools\autohunt_ui_stage1_v3\README.txt package_stage1_v3\
      - uses: actions/upload-artifact@v4
        with:
          name: AUTOHUNT_UI_STAGE1_V3
          path: package_stage1_v3
          if-no-files-found: error
