name: Validate AutoHunt Alias V5 PowerShell 5.1

on:
  push:
    branches:
      - native-autohunt-ui-v1
    paths:
      - 'ValidationV5/**'
      - '.github/workflows/validate-autohunt-alias-v5.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse with Windows PowerShell 5.1
        shell: cmd
        run: >
          powershell.exe -NoProfile -Command
          "$e=$null;$t=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'ValidationV5\PATCH_AUTOHUNT_ALIAS_V5.ps1'),[ref]$t,[ref]$e)|Out-Null;if($e.Count){$e|%%{Write-Host ($_.Extent.StartLineNumber.ToString()+': '+$_.Message)};exit 1}else{Write-Host 'WINDOWS_POWERSHELL_5_1_PARSE_OK'}"

      - name: Run script self-test with Windows PowerShell 5.1
        shell: cmd
        run: >
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File
          "ValidationV5\PATCH_AUTOHUNT_ALIAS_V5.ps1" -SelfTest

      - name: Upload exact validated script
        uses: actions/upload-artifact@v4
        with:
          name: AUTOHUNT_ALIAS_V5_PS51_VALIDATED_SCRIPT
          path: ValidationV5/PATCH_AUTOHUNT_ALIAS_V5.ps1
          if-no-files-found: error
