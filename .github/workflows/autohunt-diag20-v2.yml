name: Package AUTO Diag20 V2

on:
  push:
    branches:
      - autohunt-diag20-labels
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package_v2 | Out-Null
          Copy-Item tools\autohunt_diag20_v2\AUTO_DIAG20_PATCH_V2.ps1 package_v2\
          Copy-Item tools\autohunt_diag20_v2\RUN_AUTO_DIAG20_V2.bat package_v2\
          Copy-Item tools\autohunt_diag20_v2\README.txt package_v2\
          Get-ChildItem package_v2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO_DIAG20_29999_UI_LABELS_V2
          path: package_v2
          if-no-files-found: error
