name: Package AutoHunt Auto Patch V2.1

on:
  push:
    branches:
      - native-autohunt-ui-v1
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package_v21 | Out-Null
          New-Item -ItemType Directory -Force -Path package_v21\tools | Out-Null
          Copy-Item AutoHuntAutoPatchV21\APPLY_AUTOHUNT_PATCH.ps1 package_v21\
          Copy-Item AutoHuntAutoPatchV21\UPDATE_AUTOHUNT.bat package_v21\
          Copy-Item AutoHuntAutoPatchV21\README_사용법.txt package_v21\
          Copy-Item AutoHuntPatchUpdater\config.json package_v21\
          Copy-Item InGameAutoHuntWindowV2\AUTOHUNT_INGAME_WINDOW_V2.ps1 package_v21\tools\
          Copy-Item InGameAutoHuntWindow\RESTORE_AUTOHUNT_INGAME_WINDOW_V1.bat package_v21\

      - uses: actions/upload-artifact@v4
        with:
          name: AUTOHUNT_AUTO_PATCH_V2_1
          path: package_v21
          if-no-files-found: error
