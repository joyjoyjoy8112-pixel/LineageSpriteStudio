name: Package AutoHunt Patch Updater

on:
  push:
    branches:
      - native-autohunt-ui-v1
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package_updater | Out-Null
          Copy-Item AutoHuntPatchUpdater\* package_updater\ -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AUTOHUNT_AUTO_UPDATER
          path: package_updater
          if-no-files-found: error
