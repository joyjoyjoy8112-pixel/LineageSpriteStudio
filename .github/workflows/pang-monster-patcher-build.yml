name: Build Pang Monster Patcher

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "PangMonsterPatcher/**"
      - "SpritePak.cs"
      - "SprDecoder.cs"
      - "SprEncoder.cs"
      - ".github/workflows/pang-monster-patcher-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Pang Monster Patcher
        run: dotnet publish PangMonsterPatcher/PangMonsterPatcher.csproj -c Release -r win-x64 --self-contained true -o publish-pang

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pang_Monster_Patcher_win-x64
          path: publish-pang
